name: Documentation localization migration

on:
  push:
    branches:
      - feat/korean-lsp-docs

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/migrate-localizable-descriptions.mjs
      - run: node scripts/patch-description-generator.mjs
      - run: node scripts/refactor-lsp-documentation.mjs
      - run: node scripts/refactor-lsp-documentation-extra.mjs
      - run: node scripts/fix-generated-lsp.mjs
      - run: node generate-the-other-languages-doc.js
      - run: git diff > migration.patch
      - run: git diff --check
      - run: pnpm run check-types
      - run: pnpm run lint
      - run: pnpm run test:lsp
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documentation-localization-migration
          path: migration.patch
