name: Temporary localized documentation cleanup

on:
  push:
    branches:
      - tmp/korean-lsp-cleanup

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22.4
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - name: Restore upstream data and migrate descriptions only
        run: |
          git remote add upstream https://github.com/Zezombye/overpy.git
          git fetch upstream master
          cp src/data/opy/documentation.ts /tmp/documentation.ts
          git checkout upstream/master -- src/data
          cp /tmp/documentation.ts src/data/opy/documentation.ts
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import ts from 'typescript';

          const root = process.cwd();
          function walk(dir) {
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
              const target = path.join(dir, entry.name);
              return entry.isDirectory() ? walk(target) : [target];
            });
          }
          function isDescriptionName(name) {
            return (ts.isIdentifier(name) || ts.isStringLiteral(name)) && name.text === 'description';
          }
          function localizableTypeFor(file) {
            let relative = path.relative(path.dirname(file), path.join(root, 'src', 'types')).replaceAll(path.sep, '/');
            if (!relative.startsWith('.')) relative = './' + relative;
            return `import("${relative}").LocalizableString`;
          }
          function migrateFile(file) {
            let content = fs.readFileSync(file, 'utf8');
            const source = ts.createSourceFile(file, content, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS);
            const replacements = [];
            const localizableType = localizableTypeFor(file);
            function visit(node) {
              if ((ts.isPropertySignature(node) || ts.isPropertyDeclaration(node)) && isDescriptionName(node.name) && node.type?.kind === ts.SyntaxKind.StringKeyword) {
                replacements.push({ start: node.type.getStart(source), end: node.type.end, text: localizableType });
              }
              if (ts.isPropertyAssignment(node) && isDescriptionName(node.name) && !ts.isObjectLiteralExpression(node.initializer)) {
                const init = node.initializer;
                if (init.kind !== ts.SyntaxKind.UndefinedKeyword && init.kind !== ts.SyntaxKind.NullKeyword) {
                  replacements.push({ start: init.getStart(source), end: init.end, text: `{ "en-US": ${init.getText(source)} }` });
                }
              }
              ts.forEachChild(node, visit);
            }
            visit(source);
            replacements.sort((a, b) => b.start - a.start);
            for (const r of replacements) content = content.slice(0, r.start) + r.text + content.slice(r.end);
            if (replacements.length) fs.writeFileSync(file, content);
          }
          for (const file of walk(path.join(root, 'src', 'data')).filter((file) => file.endsWith('.ts') && !file.endsWith('documentation.ts'))) migrateFile(file);

          const modulesPath = path.join(root, 'src', 'data', 'opy', 'modules.ts');
          let modules = fs.readFileSync(modulesPath, 'utf8');
          modules = modules.replace(
            '    opyModules[key]["description"] = "The `"+key+"` module.";',
            '    opyModules[key]["description"] = { "en-US": "The `"+key+"` module." };',
          );
          fs.writeFileSync(modulesPath, modules);
          NODE
      - run: git diff --check
      - run: pnpm run check-types
      - run: pnpm run lint
      - run: pnpm run test:core
      - run: pnpm run test:cli
      - run: pnpm run test:lsp
      - name: Commit clean source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-clean-doc-localization.yml
          git add src/data
          git commit -m "test: preserve existing locale data during documentation migration"
          git push origin HEAD:tmp/korean-lsp-cleanup
